services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./public/files:/usr/share/nginx/html/files
    networks:
      - hackathon-network
    restart: unless-stopped

networks:
  hackathon-network:
    external: true
    name: hackathon-network
